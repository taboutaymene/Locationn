<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share Location</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#f5f5f5;margin:0;padding:24px}
.card{max-width:420px;margin:40px auto;background:#fff;border-radius:20px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.08);text-align:center}
button{width:100%;padding:16px;margin-top:18px;border:0;border-radius:12px;background:#111;color:#fff;font-size:17px}
#status{margin-top:18px;line-height:1.5}
.small{font-size:13px;color:#666}
</style>
</head>
<body>
<div class="card">
<h2>📍 Share my location</h2>
<p>Please tap the button below. Your phone will ask for permission to use your location.</p>
<button id="share">Share my current location</button>
<div id="status"></div>
<p class="small">Your location is only used after you approve the browser's location permission.</p>
</div>
<script>
const status=document.getElementById('status');
document.getElementById('share').onclick=()=>{
 if(!navigator.geolocation){
   status.textContent='Location is not supported by this browser.';
   return;
 }
 status.textContent='Requesting location permission…';
 navigator.geolocation.getCurrentPosition(
   p=>{
     const lat=p.coords.latitude, lon=p.coords.longitude;
     const maps=`https://www.google.com/maps?q=${lat},${lon}`;
     status.innerHTML='✅ Location found.<br><a href="'+maps+'" target="_blank">Open in Google Maps</a>';
     if(navigator.share){
       navigator.share({title:'My location',text:'Here is my current location:',url:maps})
         .catch(()=>{});
     }else{
       navigator.clipboard?.writeText(maps);
       status.innerHTML+=' <br><br>The Google Maps link was copied. Paste it into WhatsApp.';
     }
   },
   e=>{
     status.textContent = e.code===1
       ? 'Location permission was not granted.'
       : 'Could not get the location. Please try again.';
   },
   {enableHighAccuracy:true,timeout:15000,maximumAge:0}
 );
};
</script>
</body>
</html>
