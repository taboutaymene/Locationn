<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share Location</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#f5f5f5;margin:0;padding:24px}
.card{max-width:420px;margin:40px auto;background:#fff;border-radius:20px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.08);text-align:center}
button{width:100%;padding:16px;margin-top:18px;border:0;border-radius:12px;background:#111;color:#fff;font-size:17px}
#status{margin-top:18px;line-height:1.5}
.small{font-size:13px;color:#666}
</style>
</head>
<body>
<div class="card">
<h2>📍 Share my location</h2>
<p>Tap below to share your current location. Your browser will ask for permission first.</p>
<button id="share">Share my current location</button>
<div id="status"></div>
<p class="small">Your location is sent only after you approve the browser's location request.</p>
</div>
<script>
const endpoint = "https://script.google.com/macros/s/AKfycbxldRlBYUCERWJUj_lkjr-fcL7NH6BLLFtGzxopOJKCr-VhsCCBaxdSBlgQZHI2ZTt86A/exec";
const status = document.getElementById("status");
document.getElementById("share").onclick = () => {
  if (!navigator.geolocation) {
    status.textContent = "Location is not supported on this device.";
    return;
  }
  status.textContent = "Requesting location permission…";
  navigator.geolocation.getCurrentPosition(
    async (position) => {
      const payload = {
        latitude: position.coords.latitude,
        longitude: position.coords.longitude,
        accuracy: position.coords.accuracy
      };
      status.textContent = "Sending your location…";
      try {
        await fetch(endpoint, {
          method: "POST",
          headers: {"Content-Type": "text/plain;charset=UTF-8"},
          body: JSON.stringify(payload)
        });
        status.innerHTML = "✅ Location shared successfully.";
      } catch (error) {
        status.textContent = "The location was found, but it could not be sent. Please try again.";
      }
    },
    (error) => {
      status.textContent = error.code === 1
        ? "Location permission was not granted."
        : "Could not get the location. Please try again.";
    },
    {enableHighAccuracy:true, timeout:15000, maximumAge:0}
  );
};
</script>
</body>
</html>
